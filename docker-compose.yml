services:
  app:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 8000
      DB_HOST: "${DB_HOST:-127.0.0.1}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-bsb_playhub}"
      DB_USERNAME: "${DB_USERNAME:-bsb_playhub}"
      DB_PASSWORD: "${DB_PASSWORD:?Isi DB_PASSWORD di .env terlebih dahulu}"
      JWT_SECRET: "${JWT_SECRET:-playhub-pos-jwt-secret-key-2026}"
      JWT_TTL: "${JWT_TTL:-480}"
      TZ: "Asia/Makassar"
    volumes:
      - ./storage/public:/app/storage/public
      - ./storage/backups:/app/storage/backups
